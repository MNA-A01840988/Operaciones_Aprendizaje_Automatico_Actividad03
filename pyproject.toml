[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "operaciones_aprendizaje_automatico"
version = "0.0.1"
description = "Repositorio para las actividades de la materia."
authors = [
  { name = "A01840988" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "==3.14.7"


[tool.ruff]
line-length = 99
src = ["operaciones_aprendizaje_automatico"]
include = ["pyproject.toml", "operaciones_aprendizaje_automatico/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["operaciones_aprendizaje_automatico"]
force-sort-within-sections = true

